<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侯玮 · 个人简历</title>
<script>
// 提前应用主题，避免闪烁
(function () {
  var saved = localStorage.getItem('resume-theme');
  var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
  :root {
    --primary: #4f46e5;
    --primary-2: #06b6d4;
    --accent: #f59e0b;
    --radius: 16px;
    --maxw: 1120px;
    --nav-h: 64px;
    --ease: cubic-bezier(.4, 0, .2, 1);
    --transition: 180ms var(--ease);

    --bg: #f5f6fb;
    --bg-soft: #eef0f8;
    --surface: #ffffff;
    --surface-2: #f8f9fd;
    --border: #e5e8f2;
    --text: #1c2333;
    --muted: #5c6a85;
    --shadow: 0 10px 30px -12px rgba(30, 41, 90, .18);
    --shadow-lg: 0 24px 60px -24px rgba(30, 41, 90, .28);
  }
  [data-theme="dark"] {
    --bg: #0b1220;
    --bg-soft: #101a2e;
    --surface: #121d33;
    --surface-2: #16233c;
    --border: #22304e;
    --text: #e8ecf5;
    --muted: #9fb0c9;
    --shadow: 0 12px 32px -14px rgba(0, 0, 0, .55);
    --shadow-lg: 0 28px 70px -28px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: background var(--transition), color var(--transition);
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ---------- 背景装饰 ---------- */
  .bg-decor {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  }
  .bg-decor::before, .bg-decor::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35;
  }
  .bg-decor::before {
    width: 520px; height: 520px; left: -120px; top: -140px;
    background: radial-gradient(circle, var(--primary), transparent 70%);
  }
  .bg-decor::after {
    width: 480px; height: 480px; right: -140px; top: 30%;
    background: radial-gradient(circle, var(--primary-2), transparent 70%);
  }

  /* ---------- 导航栏 ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    width: 100%; max-width: var(--maxw); padding: 0 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .5px; }
  .brand .dot {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; color: #fff; font-size: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
  }
  .nav-links { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a {
    padding: 7px 12px; border-radius: 999px; font-size: 14px; color: var(--muted);
    white-space: nowrap; transition: color var(--transition), background var(--transition);
  }
  .nav-links a:hover { color: var(--text); background: color-mix(in srgb, var(--primary) 9%, transparent); }
  .nav-actions { display: flex; gap: 8px; flex: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: grid; place-items: center;
    transition: transform var(--transition), border-color var(--transition), background var(--transition);
  }
  .icon-btn:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
  .icon-btn svg { width: 18px; height: 18px; }

  @media (max-width: 760px) {
    .nav-inner { padding: 0 14px; }
    .nav-links { display: none; }
  }

  /* ---------- 布局 ---------- */
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  section { padding: 66px 0 8px; }
  .section-head { margin-bottom: 30px; }
  .section-tag {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    color: var(--primary); letter-spacing: 1px; text-transform: uppercase;
  }
  .section-tag::before { content: ""; width: 22px; height: 2px; background: var(--primary); border-radius: 2px; }
  .section-title { margin: 8px 0 6px; font-size: 28px; font-weight: 800; letter-spacing: .5px; }
  .section-sub { margin: 0; color: var(--muted); font-size: 15px; }

  /* ---------- Hero ---------- */
  .hero { padding-top: calc(var(--nav-h) + 56px); }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
  .hero h1 { margin: 0 0 6px; font-size: 46px; line-height: 1.1; font-weight: 800; letter-spacing: 1px; }
  .hero .role {
    font-size: 18px; font-weight: 600; margin: 0 0 18px; color: var(--muted);
  }
  .hero .role strong {
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .summary { margin: 0 0 24px; color: var(--muted); font-size: 16px; max-width: 560px; }
  .hero .hero-view {
    display: inline-block; margin: 0 0 16px; padding: 10px 16px;
    background: linear-gradient(120deg, color-mix(in srgb, var(--primary) 12%, transparent), color-mix(in srgb, var(--primary-2) 12%, transparent));
    border-left: 3px solid var(--primary); border-radius: 8px;
    font-size: 15px; color: var(--text); font-weight: 600; max-width: 560px;
  }
  .hero .hero-motto {
    display: inline-block; margin: 0 0 18px; padding: 12px 16px;
    background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--primary-2) 12%, transparent));
    border-left: 3px solid var(--accent); border-radius: 8px;
    font-size: 15px; color: var(--text); font-weight: 700; max-width: 560px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
  .tag {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: transform var(--transition), border-color var(--transition);
  }
  .tag:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
    font-weight: 600; font-size: 14px; border: 1px solid transparent; transition: transform var(--transition), box-shadow var(--transition);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff;
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--primary) 80%, transparent);
  }
  .btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary:hover { box-shadow: 0 16px 32px -12px color-mix(in srgb, var(--primary) 85%, transparent); }

  .avatar-card {
    position: relative; display: grid; place-items: center; padding: 28px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow);
  }
  .avatar {
    width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center;
    font-size: 56px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 20px 44px -18px color-mix(in srgb, var(--primary) 90%, transparent);
  }
  .avatar-card .meta { margin-top: 18px; text-align: center; }
  .avatar-card .meta strong { display: block; font-size: 16px; }
  .avatar-card .meta span { color: var(--muted); font-size: 13px; }

  @media (max-width: 820px) {
    .hero-grid { grid-template-columns: 1fr; gap: 28px; }
    .hero h1 { font-size: 34px; }
    .avatar { width: 116px; height: 116px; font-size: 44px; }
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--primary) 25%, var(--border)); }

  /* ---------- 亮点 ---------- */
  .hl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .hl .num { font-size: 30px; font-weight: 800; line-height: 1;
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hl .lbl { margin: 10px 0 6px; font-weight: 700; }
  .hl .dsc { color: var(--muted); font-size: 13.5px; margin: 0; }
  @media (max-width: 900px) { .hl-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .hl-grid { grid-template-columns: 1fr; } }

  /* ---------- Tabs ---------- */
  .tablist {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 6px; margin-bottom: 22px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; width: fit-content;
    max-width: 100%;
  }
  .tab-btn {
    padding: 9px 18px; border-radius: 10px; border: none; background: transparent; color: var(--muted);
    font-weight: 600; font-size: 14px; transition: background var(--transition), color var(--transition);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn[aria-selected="true"] {
    background: var(--surface); color: var(--text); box-shadow: 0 4px 14px -6px rgba(30,41,90,.25);
  }
  .tab-panel[hidden] { display: none; }

  /* ---------- 时间线 ---------- */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(var(--primary), var(--primary-2));
    opacity: .35; border-radius: 2px;
  }
  .tl-item { position: relative; margin-bottom: 22px; }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute; left: -24px; top: 7px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--primary);
  }
  .tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 6px; }
  .tl-org { font-weight: 700; font-size: 16.5px; }
  .tl-role { color: var(--primary); font-size: 13px; font-weight: 600; }
  .tl-period { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tl-points { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
  .tl-points li { margin: 4px 0; }
  .tl-points li::marker { color: var(--primary-2); }

  /* ---------- 技能 ---------- */
  .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .skill-group h4 { margin: 4px 0 16px; font-size: 15px; font-weight: 700; }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-top { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 13.5px; }
  .bar-top .lvl { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    transition: width 900ms var(--ease);
  }
  @media (max-width: 720px) { .skill-grid { grid-template-columns: 1fr; } }

  /* ---------- 教育与证书 ---------- */
  .edu-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
  .edu-school { font-size: 18px; font-weight: 800; }
  .edu-degree { color: var(--primary); font-weight: 600; }
  .edu-clazz {
    margin-top: 10px; display: inline-block;
    padding: 4px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 700; color: var(--primary);
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
  }
  .cert-list { list-style: none; padding: 0; margin: 0; }
  .cert-list li {
    display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--border);
  }
  .cert-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .cert-ico { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--primary-2) 16%, transparent); color: var(--primary-2); }
  .cert-ico svg { width: 18px; height: 18px; }
  .cert-name { font-weight: 600; }
  .cert-detail { color: var(--muted); font-size: 13px; }
  @media (max-width: 820px) { .edu-grid { grid-template-columns: 1fr; } }

  /* ---------- 头像照片 ---------- */
  .avatar-photo { object-fit: cover; }

  /* ---------- 地址标签（带小圆图） ---------- */
  .loc-chip {
    display: inline-flex; align-items: center; gap: 9px; padding: 6px 16px 6px 7px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-weight: 600; font-size: 14px; color: var(--text);
  }
  .loc-thumb {
    width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
  }
  .loc-thumb svg { width: 16px; height: 16px; }
  .loc-img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- 作品集 ---------- */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .gallery-card {
    position: relative; overflow: hidden; margin: 0; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    cursor: zoom-in; transition: transform var(--transition), box-shadow var(--transition);
  }
  .gallery-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .gallery-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .gallery-card .cap {
    padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; justify-content: space-between;
  }
  .gallery-card .cap .hint { color: var(--muted); font-size: 12px; font-weight: 400; }

  /* ---------- 图片预览 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 200; padding: 24px; cursor: zoom-out;
    background: rgba(8, 12, 22, .88); display: grid; place-items: center;
    backdrop-filter: blur(4px);
  }
  .lightbox.hidden { display: none; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }

  /* ---------- 个人特质 ---------- */
  .trait-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .trait .word {
    font-size: 19px; font-weight: 800; margin-bottom: 8px;
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .trait .dsc { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .trait .ex {
    display: flex; gap: 8px; align-items: flex-start; padding-top: 12px;
    border-top: 1px dashed var(--border); font-size: 13px; color: var(--muted);
  }
  .trait .ex-tag {
    flex: none; margin-top: 1px; font-size: 11px; font-weight: 700; color: var(--primary);
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    padding: 1px 7px; border-radius: 6px;
  }
  .trait .ex-text { line-height: 1.6; }
  @media (max-width: 900px) { .trait-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .trait-grid { grid-template-columns: 1fr; } }

  /* ---------- 欢迎交流 ---------- */
  .contact-card { text-align: center; padding: 48px 28px; }
  .contact-card .section-tag { justify-content: center; }
  .contact-card .section-tag::before { display: none; }
  .contact-card .section-title { margin-top: 14px; }
  .contact-card .section-sub { max-width: 560px; margin: 0 auto; }
  .contact-card .cta-row { justify-content: center; }
  .contact-card .contact-sign {
    margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border);
    font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .contact-card .contact-sign .nm {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- 页脚 & 返回顶部 ---------- */
  footer { margin-top: 60px; padding: 30px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; text-align: center; }
  .to-top {
    position: fixed; right: 24px; bottom: 24px; z-index: 90; width: 46px; height: 46px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center;
    box-shadow: var(--shadow); opacity: 0; visibility: hidden; transform: translateY(12px);
    transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
  }
  .to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .to-top svg { width: 26px; height: 26px; }

  /* ---------- 进入动画 ---------- */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity 500ms var(--ease), transform 500ms var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- 打印 ---------- */
  @media print {
    .no-print, .nav, .to-top, .bg-decor, .tablist { display: none !important; }
    body { background: #fff; color: #000; }
    .container { max-width: none; padding: 0; }
    section { padding: 18px 0; break-inside: avoid; }
    .card, .avatar-card { box-shadow: none; border: 1px solid #ddd; }
    .tab-panel[hidden] { display: block !important; }
    .reveal { opacity: 1 !important; transform: none !important; }
    .bar-fill { background: #4f46e5; }
    .hero h1 { font-size: 28px; }
    a, .tl-org, .num { color: #000 !important; -webkit-text-fill-color: currentColor; }
  }
</style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <nav class="nav no-print" aria-label="主导航"></nav>

  <main id="app"></main>

  <button class="to-top no-print" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- 图片预览 -->
  <div class="lightbox hidden no-print" role="dialog" aria-modal="true" aria-label="图片预览">
    <img alt="预览图">
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
   * 简历数据 —— 在此处修改内容即可
   * 邮箱请填写真实邮箱（用户名 + 域名），填好后页面会自动显示"复制邮箱"按钮
   * ============================================================ */
  var resume = {
    name: "侯玮",
    enName: "Hou Wei",
    avatarChar: "侯",
    photo: "photo.jpg",
    locationPhoto: "zhongshan.jpg",  // 中山特色照片（孙中山故居），留空则显示定位图标圆点
    title: "会计学 × AI 应用方向",
    phone: "13680211601",
    location: "广东中山",
    // 邮箱：填写后自动显示复制按钮（下方代码会拼接，防止被爬虫抓取）
    emailUser: "",      // 例如 "houwei"
    emailDomain: "",    // 例如 "example.com"
    view: ["会计教会我用凭证记录收支，坚守公允", "AI 教会我用技术跨越局限，探索专业以外的领域"],
    summary: "会计学本科新生，正以「财务专业为根基、AI 技术为杠杆」构建复合能力，喜欢将知识放到实践中验证，从亲身体验中对知识产生更加深刻、直观的理解。自高中起坚持英语阅读与运动锻炼，2026 年暑期开始系统学习 AI 应用与编程，并考取相关证书；业余也会涉猎心理学，了解情绪为何产生，学着理解情绪的同时读懂自己。",
    motto: "把知识放进真实情境里验证，再用真实体验反哺学习，对知识形成更深刻的理解",

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function hasEmail() { return resume.emailUser && resume.emailDomain; }
  function mailTo() { return [resume.emailUser, resume.emailDomain].join("@"); }

  function copyText(text, self) {
    function done(ok) {
      var o = self ? self : document.activeElement;
      if (!o) return;
      var old = o.textContent;
      o.textContent = ok ? "已复制 ✓" : "复制失败";
      setTimeout(function () { o.textContent = old; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(true); } catch (e) { done(false); }
      document.body.removeChild(ta);
    }
  }

  /* ---------------- Tabs（经历）通用 ---------------- */
  function createTabbedSection(id, tag, title, sub, groups) {
    var visible = groups.filter(function (g) { return g.items && g.items.length; });
    if (!visible.length) return null;

    var sec = el("section");
    sec.id = id;
    var wrap = el("div", "container");

    var head = el("div", "section-head reveal");
    head.appendChild(el("span", "section-tag", tag));
    head.appendChild(el("h2", "section-title", title));
    if (sub) head.appendChild(el("p", "section-sub", sub));
    wrap.appendChild(head);

    var tablist = el("div", "tablist");
    tablist.setAttribute("role", "tablist");
    tablist.setAttribute("aria-label", title);

    var panels = el("div");
    var buttons = [];

    visible.forEach(function (g, gi) {
      var panelId = id + "-panel-" + gi;
      var btnId = id + "-tab-" + gi;

      var btn = el("button", "tab-btn");
      btn.id = btnId; btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", gi === 0 ? "true" : "false");
      btn.setAttribute("aria-controls", panelId);
      btn.tabIndex = gi === 0 ? 0 : -1;
      btn.textContent = g.label;
      tablist.appendChild(btn);
      buttons.push(btn);

      var panel = el("div", "tab-panel");
      panel.id = panelId;
      panel.setAttribute("role", "tabpanel");
      panel.setAttribute("aria-labelledby", btnId);
      panel.tabIndex = 0;
      if (gi !== 0) panel.hidden = true;
      panel.appendChild(renderTimeline(g.items));
      panels.appendChild(panel);

      btn.addEventListener("click", function () { activate(gi); });
      btn.addEventListener("keydown", function (e) {
        var dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        var next = (gi + dir + buttons.length) % buttons.length;
        buttons[next].focus();
        activate(next);
      });
    });

    function activate(i) {
      buttons.forEach(function (b, bi) {
        var on = bi === i;
        b.setAttribute("aria-selected", on ? "true" : "false");
        b.tabIndex = on ? 0 : -1;
        panels.children[bi].hidden = !on;
      });
    }

    wrap.appendChild(tablist);
    wrap.appendChild(panels);
    sec.appendChild(wrap);
    return sec;
  }

  function renderTimeline(items) {
    var tl = el("div", "timeline");
    items.forEach(function (it) {
      var item = el("div", "tl-item reveal");
      item.appendChild(el("span", "tl-dot"));
      var head = el("div", "tl-head");
      head.appendChild(el("div", "tl-org", it.org));
      if (it.role) head.appendChild(el("span", "tl-role", it.role));
      if (it.period) head.appendChild(el("span", "tl-period", it.period));
      item.appendChild(head);
      if (it.points && it.points.length) {
        var ul = el("ul", "tl-points");
        it.points.forEach(function (p) {
          var li = document.createElement("li");
          var lines = p.split("\n");
          li.appendChild(document.createTextNode(lines[0]));
          for (var k = 1; k < lines.length; k++) {
            li.appendChild(document.createElement("br"));
            li.appendChild(document.createTextNode(lines[k]));
          }
          ul.appendChild(li);
        });
        item.appendChild(ul);
      }
      tl.appendChild(item);
    });
    return tl;
  }

    resume.skills.forEach(function (g) {
      var card = el("div", "card reveal");
      card.appendChild(el("h4", null, g.group));
      g.items.forEach(function (s) {
        var row = el("div", "bar-row");
        var top = el("div", "bar-top");
        top.appendChild(el("span", null, s.name));
        top.appendChild(el("span", "lvl", s.level + "%"));
        row.appendChild(top);
        var bar = el("div", "bar");
        var fill = el("div", "bar-fill");
        fill.dataset.w = s.level;
        bar.appendChild(fill);
        row.appendChild(bar);
        card.appendChild(row);
      });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    sec.appendChild(wrap);
    return sec;
  }

  /* ---------------- 教育与证书 ---------------- */
  function renderEducation() {
    var sec = el("section");
    sec.id = "education";
    var wrap = el("div", "container");
    var head = el("div", "section-head reveal");
    head.appendChild(el("span", "section-tag", "Education"));
    head.appendChild(el("h2", "section-title", "教育与证书"));
    wrap.appendChild(head);

    var grid = el("div", "edu-grid");

    var edu = el("div", "card reveal");
    edu.appendChild(el("div", "edu-school", resume.education.school));
    edu.appendChild(el("div", "edu-degree", resume.education.degree));
    if (resume.education.clazz) {
      edu.appendChild(el("div", "edu-clazz", resume.education.clazz));
    }
    if (resume.education.points.length) {
      var ul = el("ul", "tl-points");
      ul.style.marginTop = "12px";
      resume.education.points.forEach(function (p) { ul.appendChild(el("li", null, p)); });
      edu.appendChild(ul);
    }
    grid.appendChild(edu);

    var cert = el("div", "card reveal");
    cert.appendChild(el("h4", null, "获奖与证书"));
    var list = el("ul", "cert-list");
    resume.certificates.forEach(function (c) {
      var li = el("li");
      var ico = el("span", "cert-ico");
      ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5 7 21l5-3 5 3-1.5-8.5"/></svg>';
      li.appendChild(ico);
      var box = el("div");
      box.appendChild(el("div", "cert-name", c.name));
      if (c.detail) box.appendChild(el("div", "cert-detail", c.detail));
      li.appendChild(box);
      list.appendChild(li);
    });
    cert.appendChild(list);
    grid.appendChild(cert);

    wrap.appendChild(grid);
    sec.appendChild(wrap);
    return sec;
  }

  /* ---------------- 作品集 ---------------- */
  function renderGallery() {
    if (!resume.gallery || !resume.gallery.length) return null;
    var sec = el("section");
    sec.id = "gallery";
    var wrap = el("div", "container");
    var head = el("div", "section-head reveal");
    head.appendChild(el("span", "section-tag", "Portfolio"));
    head.appendChild(el("h2", "section-title", "作品集"));
    head.appendChild(el("p", "section-sub", "点击图片可放大查看"));
    wrap.appendChild(head);

    var grid = el("div", "gallery-grid");
    resume.gallery.forEach(function (g, i) {
      var card = el("figure", "gallery-card reveal");
      card.style.transitionDelay = (i * 60) + "ms";
      var img = el("img");
      img.src = g.src;
      img.alt = g.caption || ("作品 " + (i + 1));
      img.loading = "lazy";
      card.appendChild(img);
      if (g.caption) {
        var cap = el("figcaption", "cap");
        cap.appendChild(el("span", null, g.caption));
        cap.appendChild(el("span", "hint", "点击放大"));
        card.appendChild(cap);
      }
      card.addEventListener("click", function () { openLightbox(g.src, g.caption); });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    sec.appendChild(wrap);
    return sec;
  }

  function openLightbox(src, caption) {
    var lb = document.querySelector(".lightbox");
    var img = lb.querySelector("img");
    img.src = src;
    img.alt = caption || "";
    lb.classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }

  /* ---------------- 欢迎交流 ---------------- */
  function renderContact() {
    var sec = el("section");
    sec.id = "contact";
    var wrap = el("div", "container");
    var card = el("div", "card reveal contact-card");
    card.appendChild(el("span", "section-tag", "Contact"));
    card.appendChild(el("h2", "section-title", "欢迎交流"));
    card.appendChild(el("p", "section-sub",
      "欢迎对会计学竞赛，或对 AI 应用、英语学习、个人成长感兴趣的朋友，来联系我一起讨论交流。"));
    var cta = el("div", "cta-row");
    cta.style.marginTop = "22px";
    var btnPhone = el("button", "btn btn-primary", "电话 " + resume.phone);
    btnPhone.addEventListener("click", function () { copyText(resume.phone, this); });
    cta.appendChild(btnPhone);
    if (hasEmail()) {
      var btnMail = el("button", "btn btn-ghost", "邮箱 " + mailTo());
      btnMail.addEventListener("click", function () { copyText(mailTo(), this); });
      cta.appendChild(btnMail);
    }
    card.appendChild(cta);

    var sign = el("p", "contact-sign");
    var nm = el("span", "nm", resume.name);
    sign.append("期待与你相遇 · ", nm);
    card.appendChild(sign);

    var callBtn = document.createElement("a");
    callBtn.className = "btn btn-primary";
    callBtn.href = "tel:" + resume.phone;
    callBtn.textContent = "Call Me";
    callBtn.style.marginTop = "18px";
    card.appendChild(callBtn);

    wrap.appendChild(card);
    sec.appendChild(wrap);
    return sec;
  }

  /* ---------------- 汇总渲染 ---------------- */
  function init() {
    var app = document.getElementById("app");
    var sections = [];

    var expGroups = resume.experiences.map(function (g) {
      return { label: g.label, items: g.items };
    });

    var hero = renderHero();
    app.appendChild(hero);
    sections.push({ id: "about", title: "关于" });

    var hl = renderHighlights();
    if (hl) { app.appendChild(hl); sections.push({ id: "highlights", title: "亮点" }); }

    var exp = createTabbedSection("experience", "Experience", "个人经历", "学习 / 成长轨迹", expGroups);
    if (exp) { app.appendChild(exp); sections.push({ id: "experience", title: "经历" }); }

    var tr = renderTraits();
    if (tr) { app.appendChild(tr); sections.push({ id: "traits", title: "特质" }); }

    var projGroups = resume.projects.map(function (g) {
      return { label: g.label, items: g.items };
    });
    var proj = createProjectSection(projGroups);
    if (proj) { app.appendChild(proj); sections.push({ id: "projects", title: "项目" }); }

    var sk = renderSkills();
    app.appendChild(sk);
    sections.push({ id: "skills", title: "技能" });

    var edu = renderEducation();
    app.appendChild(edu);
    sections.push({ id: "education", title: "教育" });

    var gal = renderGallery();
    if (gal) { app.appendChild(gal); sections.push({ id: "gallery", title: "作品" }); }

    var ct = renderContact();
    app.appendChild(ct);
    sections.push({ id: "contact", title: "联系" });

    var foot = el("footer");
    foot.innerHTML = "© 2026 " + resume.name + " · 个人简历 · 更新于 " + resume.updated;
    app.appendChild(foot);

    renderNav(sections);

    var lb = document.querySelector(".lightbox");
    lb.addEventListener("click", function () {
      lb.classList.add("hidden");
      document.body.style.overflow = "";
      lb.querySelector("img").src = "";
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !lb.classList.contains("hidden")) {
        lb.classList.add("hidden");
        document.body.style.overflow = "";
        lb.querySelector("img").src = "";
      }
    });

    var toTop = document.querySelector(".to-top");
    window.addEventListener("scroll", function () {
      toTop.classList.toggle("show", window.scrollY > 500);
    }, { passive: true });
    toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    revealOnScroll();

    var bars = document.querySelectorAll(".bar-fill");
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !e.target.style.width) {
          e.target.style.width = e.target.dataset.w + "%";
        }
      });
    }, { threshold: .4 });
    bars.forEach(function (b) { io.observe(b); });
  }

  function revealOnScroll() {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      document.querySelectorAll(".reveal").forEach(function (n) { n.classList.add("in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: .12 });
    document.querySelectorAll(".reveal").forEach(function (n) { io.observe(n); });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
